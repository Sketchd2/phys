[package]
name = "phys"
version = "0.1.0"
edition = "2021"
description = "Multiscale galaxy physics engine: lazy, causally-gated materialization from kiloparsecs to femtometres"
license = "MIT"

[features]
# Off by default. The core crate has no dependencies and must keep building for
# wasm32, which cannot link a database client; the Postgres backend is one
# implementation of `WorldStore` and nothing else depends on it.
default = []
postgres = ["dep:postgres"]

[dependencies]
postgres = { version = "0.19", optional = true }

[lib]
name = "phys"
path = "src/lib.rs"
# Only `lib` here. The WebAssembly build asks for a cdylib on the command line
# (`cargo rustc --crate-type cdylib`), because declaring both in the manifest
# makes every *native* build emit an output-filename collision warning for an
# artefact nothing native ever uses.

[[bin]]
name = "phys-demo"
path = "src/bin/demo.rs"

[[bin]]
name = "phys-persist"
path = "src/bin/persist.rs"

[[bin]]
name = "phys-headless"
path = "src/bin/headless.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"

[[bin]]
name = "phys-bubble"
path = "src/bin/bubble.rs"

# The test suite is numeric, and unoptimised it took twenty minutes: one test
# alone (`stepping_does_not_heat_a_node`, eleven scenarios by two hundred
# solver passes each) accounted for 405 s of that. Optimised it is 123 s for
# everything. A suite nobody will sit through is a suite that gets run less
# often than it should, which is a correctness problem wearing a performance
# costume.
#
# The two flags below are not decoration and must not be dropped. `opt-level`
# above 0 turns `overflow-checks` *off* by default, and this project depends on
# integer overflow panicking in tests: that is how the neighbour-grid bug was
# found at all, and in release the same overflow wraps silently to `i64::MIN`
# and computes physics against an arbitrary cell. `debug-assertions` likewise
# keeps every `debug_assert!` in the engine alive rather than compiling it out.
# `tests/profile_guard.rs` asserts that both are still in force.
#
# Floating-point results are unaffected: rustc does not reassociate float
# arithmetic at any opt-level, and the determinism tests pass either way.
[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true
